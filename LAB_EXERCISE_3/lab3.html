
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Form and Calculator</title>
</head>
<body>

    <!-- Header Section -->
    <div>
        <h1>My Contact Website</h1>
        <span>We are here to help you!</span>
    </div>

    <!-- Content Section -->
    <div>
        <h2>Contact Form</h2>

        <form>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <br><br>

            <label for="date">Preferred Contact Date:</label>
            <input type="date" id="date" name="date">
            <br><br>

            <label for="satisfaction">Satisfaction Level:</label>
            <input type="range" id="satisfaction"
                   name="satisfaction" min="1" max="10" value="5">
            <br><br>

            <button type="submit">Submit</button>
        </form>

        <hr>

        <h2>Inline Calculator</h2>

        <label for="num1">First Number:</label>
        <input type="number" id="num1" value="0">

        <label for="num2">Second Number:</label>
        <input type="number" id="num2" value="0">

        <p>Sum: <output id="result">0</output></p>

        <script>
            const num1 = document.getElementById("num1");
            const num2 = document.getElementById("num2");
            const result = document.getElementById("result");

            function calculateSum() {
                result.value =
                    Number(num1.value || 0) +
                    Number(num2.value || 0);
            }

            num1.addEventListener("input", calculateSum);
            num2.addEventListener("input", calculateSum);
        </script>
    </div>

    <!-- Footer Section -->
    <div>
        <p>Contact us: contact@example.com</p>
        <p>&copy; 2026 My Contact Website. All rights reserved.</p>
    </div>

</body>
</html>
